# CI for submissions/omkarrr88: lint, type-check and test the backend and the web UI, build the
# Docker images, start the whole stack with Docker Compose and run an end-to-end smoke test, and
# scan the history for secrets. No API keys are needed: the offline providers stand in for Gemini.
name: omkarrr88 CI

on:
  push:
    branches: [main]
    paths:
      - "submissions/omkarrr88/**"
      - ".github/workflows/omkarrr88-ci.yml"
  pull_request:
    paths:
      - "submissions/omkarrr88/**"
      - ".github/workflows/omkarrr88-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omkarrr88-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: submissions/omkarrr88/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
          POSTGRES_DB: documind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://documind:documind@localhost:5432/documind_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: submissions/omkarrr88/backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy app tests evaluation
      - name: Test
        run: uv run pytest --cov=app --cov-report=term --cov-fail-under=90

  frontend:
    name: Web UI (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: submissions/omkarrr88/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: submissions/omkarrr88/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images and smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: submissions/omkarrr88
    steps:
      - uses: actions/checkout@v7
      - name: Configure the stack with the offline providers
        run: |
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/; s/^EMBEDDING_PROVIDER=.*/EMBEDDING_PROVIDER=fake/' .env
      - name: Build the API and worker images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history of this submission with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt on the release page.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --log-opts="-- submissions/omkarrr88 .github/workflows/omkarrr88-ci.yml" .
