[project]
name = "documind"
version = "1.0.0"
description = "Answers questions from your own documents, with citations."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "pyjwt>=2.15",
  "argon2-cffi>=25.1",
  "python-multipart>=0.0.32",
  "pypdf>=6.19",
  "google-genai>=2.25",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "unit: needs nothing outside the process",
  "integration: needs Postgres with pgvector (TEST_DATABASE_URL)",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
