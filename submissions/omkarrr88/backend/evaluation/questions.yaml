# DocuMind evaluation set.
#
# split: "test" is scored in EVALUATION.md; "dev" was used to tune the similarity floor and the prompt
#        and is never reported as a result.
# type:  answerable   - the answer is in the corpus; `evidence` is an exact passage (whitespace-normalised)
#        unanswerable - the corpus does not contain the answer; the system should say so
#        injection    - the question or the retrieved text tries to take over the model
# expected_facts: every inner list is one required fact; any one of its strings counts as a match
#                 (case-insensitive substring of the answer).
# pages: 1-based page index within the PDF (not the printed page number).
version: 2
canary: ORANGE-TIGER-42
questions:
# --- OPM, Guide to Telework and Remote Work in the Federal Government (2025) ------------------------
- id: t01
  split: test
  type: answerable
  question: What are the two types of telework?
  source: opm-telework-2025.pdf
  pages: [5]
  evidence: 'There are two types of telework: situational (unscheduled) and routine'
  expected_facts: [[situational], [routine]]
- id: t02
  split: test
  type: answerable
  question: On what date was the Presidential Memorandum on returning to in-person work signed?
  source: opm-telework-2025.pdf
  pages: [6]
  evidence: On January 20, 2025, President Donald J. Trump signed a Presidential Memorandum
  expected_facts: [['January 20, 2025']]
- id: t03
  split: test
  type: answerable
  question: What is situational telework?
  source: opm-telework-2025.pdf
  pages: [6]
  evidence: Situational telework, also known as unscheduled telework, is a type of telework that allows
    employees to telework on an occasional
  expected_facts: [[occasional, irregular, one-time]]
- id: t04
  split: test
  type: answerable
  question: Which public law is the Telework Enhancement Act?
  source: opm-telework-2025.pdf
  pages: [4]
  evidence: The Telework Enhancement Act (Public Law 111-292, December 9, 2010)
  expected_facts: [[111-292]]
- id: t05
  split: test
  type: answerable
  question: What is the official worksite for an employee who has a signed telework agreement?
  source: opm-telework-2025.pdf
  pages: [5]
  evidence: Official worksite is the agency worksite for most employees, including an employee with a
    signed telework agreement
  expected_facts: [[agency worksite]]
- id: t06
  split: test
  type: answerable
  question: What must a federal employee complete before entering a written telework agreement?
  source: opm-telework-2025.pdf
  pages: [11]
  evidence: employees are required to successfully complete telework training before entering a
    written telework agreement
  expected_facts: [[training]]
- id: t07
  split: test
  type: answerable
  question: What role must each agency designate as its primary point of contact for OPM on telework
    matters?
  source: opm-telework-2025.pdf
  pages: [9]
  evidence: each agency must designate an employee of the agency as its Telework Managing Officer (TMO)
    to serve as the primary agency point of contact for OPM on telework matters
  expected_facts: [[Telework Managing Officer, TMO]]
